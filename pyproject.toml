[project]
name = "toa-mcp"
version = "0.2.0"
description = "Minimal toa-rules MCP server: standards, infra wiring, brand tokens over TOA_RULES_HOME. Design styles live in toa-agents."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1,<2",
    "pydantic>=2",
]

[project.scripts]
toa-mcp = "toa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toa_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"

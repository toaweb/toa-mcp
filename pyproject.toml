[project]
name = "toa-mcp"
version = "0.1.0"
description = "toa-rules MCP server — a thin reader over the toa-rules data layer"
requires-python = ">=3.12"
dependencies = [
    # 2.0 is in beta and will break the API surface — pin below it deliberately.
    "mcp>=1.28.1,<2",
    "pydantic-settings>=2.7",
    "starlette>=0.41",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toa_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

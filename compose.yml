services:
  toa-mcp:
    build: .
    image: toa-mcp:0.1.0
    container_name: toa-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      TOA_RULES_PATH: /srv/toa-rules
    volumes:
      # The data layer, read-only. Kept outside the image so a rule change is a
      # git pull in toa-rules, not a rebuild.
      - ${TOA_RULES_HOST_PATH:?set TOA_RULES_HOST_PATH in .env}:/srv/toa-rules:ro
    networks: [proxy]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.toa-mcp.rule: Host(`mcp.toaweb.com`)
      traefik.http.routers.toa-mcp.entrypoints: websecure
      traefik.http.routers.toa-mcp.tls: "true"
      traefik.http.routers.toa-mcp.tls.certresolver: cloudflare
      # Bearer auth is validated inside the app (Q5), not by a Traefik middleware.
      #
      # toa-default@file is what AX41 actually defines and what 8 other routers
      # use: a chain of toa-security (frameDeny, nosniff, XSS filter, referrer
      # policy, X-Robots-Tag noindex, Server header stripped) and toa-ratelimit
      # (100 avg / 50 burst per source IP).
      #
      # TRAEFIK_STANDARD_2026.md prescribes ratelimit@file, security-headers@file
      # and compress@file. None of those three exist on AX41 — using them would
      # leave the router unable to resolve its middlewares. See CATCH-UP item 22.
      traefik.http.routers.toa-mcp.middlewares: toa-default@file
      traefik.http.services.toa-mcp.loadbalancer.server.port: "8000"

networks:
  proxy:
    external: true
